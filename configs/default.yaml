data:
  davis_root: data/DAVIS
  features_root: data/features
  year: "2017"
  resolution: 480p
  size: [480, 864]          # multiples of 16; DAVIS 480p frames are 480x854
  variants: [clean, occ0, occ1]   # occN = synthetic occlusion with seed N

backbone:
  name: dinov3_vits16
  repo: null                 # null -> ../dinov3 or $DINOV3_REPO
  weights: null              # null -> ~/.cache/torch/hub/checkpoints/<name>_pretrain_lvd1689m*.pth
  device: auto

occlusion:
  min_len: 4
  max_len: 12
  start_min: 2
  scale: [0.8, 1.4]          # occluder size relative to target bbox
  jitter: 0.15               # centre jitter as fraction of target bbox

baseline:
  n_last: 7
  topk: 5
  radius: 12
  temperature: 0.07

model:
  c_key: 64
  c_value: 256
  hidden: 256
  memory_max: 8
  vis_gate: 0.5
  readout_topk: 32
  pos_dim: 32                # 2-D sinusoidal position channels in the keys (0 = off)
  locality_radius: 12        # recent-memory reads limited to this patch radius; frame 0 global (0 = off)
  use_prior: true            # zero-shot k-NN label propagation from memory fed to decoder + visibility head
  prior_topk: 5
  prior_temperature: 0.07

train:
  epochs: 15
  lr: 2.0e-4
  clip_len: 12
  gap_max: 2                 # random frame gap in cached frames (cache is stride 2 -> 2-4 original frames)
  clips_per_epoch: 300
  holdout: 8                 # train sequences held out; validation = their clean variant, full length
  teacher_forcing_start: 1.0
  teacher_forcing_end: 0.2
  w_mask: 1.0
  w_vis: 0.5
  seed: 0
